<!DOCTYPE html>
<html>
<head>
    <title>Strong Password Registration</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #141e30, #243b55);
            text-align: center;
            padding: 40px;
        }

        .card {
            background: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,.4);
        }

        h1 {
            color: white;
        }

        h2 {
            color: #2563eb;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .rules {
            text-align: left;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
        }

        .success {
            color: #15803d;
            background: #dcfce7;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>🔒 Secure Registration</h1>

<div id="root"></div>

<script type="text/babel">

function Registration() {

    const [username, setUsername] = React.useState("");
    const [password, setPassword] = React.useState("");
    const [message, setMessage] = React.useState("");

    function validatePassword() {

        if (username === "" || password === "") {

            setMessage(" Please fill all fields.");
            return;
        }

        if (password.length < 8) {

            setMessage(
                " Password must contain at least 8 characters."
            );
            return;
        }

        if (!/[A-Z]/.test(password)) {

            setMessage(
                " Password must contain one uppercase letter."
            );
            return;
        }

        if (!/[0-9]/.test(password)) {

            setMessage(
                " Password must contain one number."
            );
            return;
        }

        if (!/[!@#$%^&*]/.test(password)) {

            setMessage(
                " Password must contain one special character."
            );
            return;
        }

        setMessage(" Strong password! Registration successful.");
    }

    return (
        <div className="card">

            <h2>Create Secure Account</h2>

            <input
                type="text"
                placeholder="Username"
                value={username}
                onChange={(e) =>
                    setUsername(e.target.value)
                }
            />

            <input
                type="password"
                placeholder="Enter Password"
                value={password}
                onChange={(e) =>
                    setPassword(e.target.value)
                }
            />

            <div className="rules">

                <b>Password Requirements:</b>

                <p>✔ Minimum 8 characters</p>
                <p>✔ One uppercase letter</p>
                <p>✔ One number</p>
                <p>✔ One special character</p>

            </div>

            <button onClick={validatePassword}>
                Register
            </button>

            {message && (
                <div className={
                    message.includes("successful")
                    ? "success"
                    : "error"
                }>
                    {message}
                </div>
            )}

        </div>
    );
}

function App() {
    return <Registration />;
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
