<!DOCTYPE html>
<html>
<head>
    <title>React Employee Salary</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            text-align: center;
            padding: 40px;
        }

        .card {
            background: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h1 {
            color: white;
        }

        h2 {
            color: #059669;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 7px;
            background: #059669;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #047857;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #ecfdf5;
            border-radius: 10px;
        }

        .salary {
            font-size: 28px;
            font-weight: bold;
            color: #059669;
        }
    </style>
</head>

<body>

<h1> Employee Salary Calculator</h1>

<div id="root"></div>

<script type="text/babel">

function Employee(props) {

    const [salary, setSalary] = React.useState("");
    const [bonus, setBonus] = React.useState("");
    const [total, setTotal] = React.useState(0);

    function calculateSalary() {

        let basic = Number(salary);
        let bonusAmount = Number(bonus);

        setTotal(basic + bonusAmount);

    }

    function reset() {

        setSalary("");
        setBonus("");
        setTotal(0);

    }

    return (
        <div className="card">

            <h2>Employee Information</h2>

            <p>
                <b>Name:</b> {props.name}
            </p>

            <p>
                <b>Department:</b> {props.department}
            </p>

            <input
                type="number"
                placeholder="Basic Salary"
                value={salary}
                onChange={(e) =>
                    setSalary(e.target.value)
                }
            />

            <input
                type="number"
                placeholder="Bonus"
                value={bonus}
                onChange={(e) =>
                    setBonus(e.target.value)
                }
            />

            <br />

            <button onClick={calculateSalary}>
                Calculate
            </button>

            <button onClick={reset}>
                Reset
            </button>

            <div className="result">

                <h3>Total Salary</h3>

                <p className="salary">
                    {total}
                </p>

            </div>

        </div>
    );
}

function App() {

    return (
        <Employee
            name="Rahul"
            department="IT Department"
        />
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
