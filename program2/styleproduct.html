<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            background-color: #fff3e0;
            font-family: Arial;
        }

        .product {
            width: 300px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 12px gray;
        }

        h2 {
            color: #e65100;
        }

        .price {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background-color: #ff9800;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
        }

        button:hover {
            background-color: #e65100;
        }
    </style>
</head>

<body>

    <div class="product">
        <h2>Laptop</h2>
        <p>High performance laptop</p>

        <p class="price">₹25,000</p>

        <button>Buy Now</button>
    </div>

</body>
</html>
