<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #673ab7;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .card h2 {
            color: #673ab7;
        }

        .card p {
            color: #555555;
            font-size: 18px;
        }

        .footer {
            background-color: #333333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Dashboard</h1>
        <p>Welcome Student</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>Subjects</h2>
            <p>5 Subjects</p>
        </div>

        <div class="card">
            <h2>Attendance</h2>
            <p>85%</p>
        </div>

        <div class="card">
            <h2>Marks</h2>
            <p>450 / 500</p>
        </div>

    </div>

    <div class="footer">
        <p>© 2026 Student Dashboard</p>
    </div>

</body>
</html>
